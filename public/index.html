<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TTSG İstihbarat Panosu</title>
<style>
  :root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page-plane:     #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --baseline:       #c3c2b7;
    --border:         rgba(11,11,11,0.10);

    --slot-1: #2a78d6; /* sermaye_artirimi */
    --slot-2: #eb6834; /* sermaye_azaltimi */
    --slot-3: #1baf7a; /* adres_degisikligi */
    --slot-4: #eda100; /* genel_kurul */
    --slot-5: #e87ba4; /* unvan_degisikligi */
    --slot-6: #008300; /* ortak_degisikligi */
    --slot-7: #4a3aa7; /* tasfiye */
    --slot-8: #e34948; /* mudur_atama */
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --page-plane:     #0d0d0d;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --gridline:       #2c2c2a;
      --baseline:       #383835;
      --border:         rgba(255,255,255,0.10);

      --slot-1: #3987e5;
      --slot-2: #d95926;
      --slot-3: #199e70;
      --slot-4: #c98500;
      --slot-5: #d55181;
      --slot-6: #008300;
      --slot-7: #9085e9;
      --slot-8: #e66767;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --page-plane:     #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --gridline:       #2c2c2a;
    --baseline:       #383835;
    --border:         rgba(255,255,255,0.10);

    --slot-1: #3987e5;
    --slot-2: #d95926;
    --slot-3: #199e70;
    --slot-4: #c98500;
    --slot-5: #d55181;
    --slot-6: #008300;
    --slot-7: #9085e9;
    --slot-8: #e66767;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page-plane);
    color: var(--text-primary);
  }
  .wrap {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px 20px 64px;
  }
  header.app-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 20px;
  }
  header.app-header h1 {
    font-size: 20px;
    margin: 0;
  }
  header.app-header p {
    margin: 4px 0 0;
    color: var(--text-secondary);
    font-size: 13px;
  }
  .theme-toggle {
    border: 1px solid var(--border);
    background: var(--surface-1);
    color: var(--text-primary);
    border-radius: 8px;
    padding: 8px 12px;
    cursor: pointer;
    font-size: 13px;
  }

  .kpi-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .stat-tile {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .stat-tile .label {
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }
  .stat-tile .value {
    font-size: 26px;
    font-weight: 600;
    font-variant-numeric: proportional-nums;
  }

  .filters {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: end;
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 150px;
  }
  .field label {
    font-size: 11px;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: .03em;
  }
  .field input, .field select {
    border: 1px solid var(--border);
    background: var(--page-plane);
    color: var(--text-primary);
    border-radius: 6px;
    padding: 7px 8px;
    font-size: 13px;
    font-family: inherit;
  }
  .field.grow { flex: 1; min-width: 200px; }

  .ms-field { position: relative; }
  .ms-trigger {
    border: 1px solid var(--border);
    background: var(--page-plane);
    color: var(--text-primary);
    border-radius: 6px;
    padding: 7px 8px;
    font-size: 13px;
    font-family: inherit;
    text-align: left;
    cursor: pointer;
    min-width: 220px;
    max-width: 260px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .ms-panel {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    z-index: 20;
    width: 280px;
    max-height: 300px;
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .ms-search {
    margin: 8px;
    border: 1px solid var(--border);
    background: var(--page-plane);
    color: var(--text-primary);
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 13px;
    font-family: inherit;
  }
  .ms-list { overflow-y: auto; padding: 0 8px 8px; }
  .ms-option {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 4px;
    font-size: 13px;
    cursor: pointer;
    border-radius: 4px;
  }
  .ms-option:hover { background: color-mix(in srgb, var(--text-primary) 6%, transparent); }
  .ms-option input { cursor: pointer; margin: 0; }
  .ms-option.hidden { display: none; }
  .filters .actions { display: flex; gap: 8px; }
  button.primary, button.ghost {
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
  }
  button.primary {
    background: var(--slot-1);
    color: #ffffff;
    border: 1px solid var(--slot-1);
  }
  button.ghost {
    background: transparent;
    color: var(--text-secondary);
    border: 1px solid var(--border);
  }
  button.danger {
    background: transparent;
    color: var(--slot-2);
    border: 1px solid var(--slot-2);
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
  }
  button.danger:hover { background: color-mix(in srgb, var(--slot-2) 12%, transparent); }

  .table-card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 820px; }
  thead th {
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .03em;
    color: var(--text-muted);
    border-bottom: 1px solid var(--gridline);
    padding: 10px 12px;
    white-space: nowrap;
  }
  tbody td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--gridline);
    font-size: 13px;
    vertical-align: top;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: color-mix(in srgb, var(--text-primary) 3%, transparent); }
  .company-title { font-weight: 600; }
  .sector-pill {
    display: inline-block;
    font-size: 11px;
    color: var(--text-secondary);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px 8px;
  }
  .event-badges { display: flex; flex-direction: column; gap: 4px; }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-primary);
  }
  .badge .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex: none;
  }
  .col-summary { min-width: 340px; max-width: 480px; white-space: normal; line-height: 1.45; }
  .muted { color: var(--text-muted); }
  .pdf-link { color: var(--slot-1); text-decoration: none; font-size: 12px; }
  .pdf-link:hover { text-decoration: underline; }
  .excerpt-toggle {
    background: none; border: none; color: var(--text-secondary);
    font-size: 12px; cursor: pointer; padding: 0; text-decoration: underline;
  }
  .excerpt-row td {
    background: var(--page-plane);
    font-size: 12px;
    color: var(--text-secondary);
    white-space: pre-wrap;
  }

  .state-row td {
    text-align: center;
    padding: 32px 12px;
    color: var(--text-secondary);
    font-size: 13px;
  }

  .pagination {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    font-size: 12px;
    color: var(--text-secondary);
  }
  .pagination .buttons { display: flex; gap: 8px; }
  .pagination button:disabled { opacity: .4; cursor: not-allowed; }
</style>
</head>
<body>
  <div class="wrap">
    <header class="app-header">
      <div>
        <h1>TTSG İstihbarat Panosu</h1>
        <p>Ticaret Sicil Gazetesi'nden tespit edilen şirket gelişmeleri</p>
      </div>
      <button class="theme-toggle" id="themeToggle" type="button">🌓 Tema</button>
    </header>

    <section class="kpi-row" id="kpiRow">
      <div class="stat-tile"><div class="label">Toplam Şirket</div><div class="value" id="statCompanies">—</div></div>
      <div class="stat-tile"><div class="label">Toplam Gelişme Kaydı</div><div class="value" id="statEvents">—</div></div>
      <div class="stat-tile"><div class="label">Bu Hafta Eklenen</div><div class="value" id="statWeek">—</div></div>
    </section>

    <form class="filters" id="addCompanyForm">
      <div class="field grow">
        <label for="cTitle">Yeni Şirket Unvanı</label>
        <input id="cTitle" type="text" placeholder="Tam ticaret unvanı (TTSG'deki ile birebir aynı olmalı)" required />
      </div>
      <div class="field ms-field" id="manualMudurlukField" style="display:none">
        <label for="cMudurlukBtn">Sicil Müdürlüğü (birden fazla seçilebilir)</label>
        <button type="button" class="ms-trigger" id="cMudurlukBtn">Seçiniz…</button>
        <div class="ms-panel" id="cMudurlukPanel" style="display:none">
          <input type="text" class="ms-search" id="cMudurlukSearch" placeholder="Sicil müdürlüğü ara…" />
          <div class="ms-list" id="cMudurlukList"></div>
        </div>
      </div>
      <div class="field">
        <label for="cTaxNumber">Vergi No (opsiyonel)</label>
        <input id="cTaxNumber" type="text" placeholder="" />
      </div>
      <div class="actions">
        <button class="primary" type="submit" id="addCompanySubmit">Şirket Ekle</button>
      </div>
      <div class="field grow" style="font-size:12px;color:var(--text-secondary);display:flex;align-items:center;gap:10px">
        <span id="extBadge">Eklenti kontrol ediliyor…</span>
        <button type="button" class="ghost" id="toggleManualBtn" style="display:none;padding:4px 10px;font-size:12px">Elle seç</button>
      </div>
      <div id="addCompanyMsg" style="font-size:12px;color:var(--text-secondary);width:100%"></div>
    </form>

    <div class="table-card" id="companyListCard" style="margin-bottom:16px">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Şirket</th>
              <th>Sicil Müdürlüğü</th>
              <th>Vergi No</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="companyListBody">
            <tr class="state-row"><td colspan="4">Yükleniyor…</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <form class="filters" id="filterForm">
      <div class="field">
        <label for="fSector">Sektör</label>
        <select id="fSector"><option value="">Tümü</option></select>
      </div>
      <div class="field">
        <label for="fEventType">Olay Türü</label>
        <select id="fEventType"><option value="">Tümü</option></select>
      </div>
      <div class="field grow">
        <label for="fCompany">Şirket Ara</label>
        <input id="fCompany" type="text" placeholder="Şirket unvanı..." />
      </div>
      <div class="field">
        <label for="fDateFrom">Başlangıç Tarihi</label>
        <input id="fDateFrom" type="date" />
      </div>
      <div class="field">
        <label for="fDateTo">Bitiş Tarihi</label>
        <input id="fDateTo" type="date" />
      </div>
      <div class="actions">
        <button class="primary" type="submit">Filtrele</button>
        <button class="ghost" type="button" id="clearFilters">Temizle</button>
      </div>
    </form>

    <div class="table-card">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Şirket</th>
              <th>Sektör</th>
              <th>Gazete Tarihi</th>
              <th>Gazete No</th>
              <th>Tespit Edilen Olaylar</th>
              <th class="col-summary">Özet</th>
              <th>Kaynak</th>
            </tr>
          </thead>
          <tbody id="eventsBody">
            <tr class="state-row"><td colspan="7">Yükleniyor…</td></tr>
          </tbody>
        </table>
      </div>
      <div class="pagination">
        <span id="pageInfo">—</span>
        <div class="buttons">
          <button class="ghost" id="prevPage" type="button">← Önceki</button>
          <button class="ghost" id="nextPage" type="button">Sonraki →</button>
        </div>
      </div>
    </div>
  </div>

<script>
(function () {
  const PAGE_SIZE = 25;
  let eventTypeMeta = []; // [{key, label}] - EVENT_PATTERNS sirasiyla ayni, slot renklerini belirler
  let offset = 0;
  let totalCount = 0;

  const el = (id) => document.getElementById(id);
  const eventsBody = el('eventsBody');
  const pageInfo = el('pageInfo');

  function slotColor(index) {
    return `var(--slot-${(index % 8) + 1})`;
  }

  function escapeHtml(str) {
    return String(str ?? '').replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  async function loadMeta() {
    const res = await fetch('/api/meta');
    if (!res.ok) throw new Error('meta yuklenemedi');
    const meta = await res.json();
    eventTypeMeta = meta.eventTypes;

    const sectorSelect = el('fSector');
    meta.sectors.forEach((s) => {
      const opt = document.createElement('option');
      opt.value = s;
      opt.textContent = s.replace(/_/g, ' ');
      sectorSelect.appendChild(opt);
    });

    const eventSelect = el('fEventType');
    meta.eventTypes.forEach((e) => {
      const opt = document.createElement('option');
      opt.value = e.key;
      opt.textContent = e.label;
      eventSelect.appendChild(opt);
    });

    initMudurlukMultiselect(meta.sicilMudurlukleri || []);
  }

  // --- Eklenti köprüsü (extension/content.js) ---
  // Dashboard TTSG oturum çerezine hiçbir zaman doğrudan erişemez (same-origin
  // kısıtı); sicil müdürlüğü otomatik tespiti için content script üzerinden
  // eklentiyle window.postMessage ile konuşur. Eklenti kurulu/bağlı değilse
  // (PING'e 1.5 sn içinde READY gelmezse) elle seçim akışına geri düşer.
  let extConnected = false;
  let manualMode = false;
  let reqCounter = 0;
  const nextRequestId = () => `req${++reqCounter}`;

  function setManualMode(on) {
    manualMode = on;
    el('manualMudurlukField').style.display = on ? 'flex' : 'none';
    el('toggleManualBtn').textContent = on ? 'Otomatik tespite dön' : 'Elle seç';
  }

  function updateExtBadge() {
    const badge = el('extBadge');
    const toggleBtn = el('toggleManualBtn');
    if (extConnected) {
      badge.textContent = '✓ Eklenti bağlı — sicil müdürlüğü otomatik tespit edilecek';
      toggleBtn.style.display = '';
      setManualMode(false);
    } else {
      badge.textContent = '⚠ Eklenti bulunamadı — sicil müdürlüğünü elle seçin';
      toggleBtn.style.display = 'none';
      setManualMode(true);
    }
  }

  function initExtensionBridge() {
    let settled = false;

    window.addEventListener('message', (event) => {
      if (event.source !== window) return;
      const msg = event.data;
      if (!msg || msg.source !== 'ttsg-extension' || msg.type !== 'READY' || settled) return;
      settled = true;
      extConnected = true;
      updateExtBadge();
    });

    window.postMessage({ source: 'ttsg-dashboard', type: 'PING', requestId: nextRequestId() }, window.location.origin);

    setTimeout(() => {
      if (settled) return;
      settled = true;
      extConnected = false;
      updateExtBadge();
    }, 1500);

    el('toggleManualBtn').addEventListener('click', () => setManualMode(!manualMode));
  }

  // Bir kerelik tespit isteği gönderir; ilerleme mesajlarını addCompanyMsg'ye
  // yazar, sonuç (DETECT_RESULT) geldiğinde promise'i çözer.
  function detectAndAddViaExtension(title) {
    return new Promise((resolve, reject) => {
      const requestId = nextRequestId();
      const handler = (event) => {
        if (event.source !== window) return;
        const msg = event.data;
        if (!msg || msg.source !== 'ttsg-extension' || msg.requestId !== requestId) return;
        if (msg.type === 'DETECT_PROGRESS') {
          el('addCompanyMsg').textContent = msg.text || '';
          return;
        }
        if (msg.type === 'DETECT_RESULT') {
          window.removeEventListener('message', handler);
          if (msg.status === 'error') {
            reject(new Error(msg.text || 'Tespit sırasında hata oluştu.'));
          } else {
            resolve(msg);
          }
        }
      };
      window.addEventListener('message', handler);
      window.postMessage(
        { source: 'ttsg-dashboard', type: 'DETECT_AND_ADD_COMPANY', requestId, title, backendUrl: window.location.origin },
        window.location.origin
      );
    });
  }

  // --- Sicil Müdürlüğü çoklu seçim (tıklanınca açılan panel) ---
  const selectedMudurlukIds = new Set();

  function updateMudurlukTrigger(allMudurlukler) {
    const btn = el('cMudurlukBtn');
    if (selectedMudurlukIds.size === 0) {
      btn.textContent = 'Seçiniz…';
      return;
    }
    const names = allMudurlukler
      .filter((m) => selectedMudurlukIds.has(m.id))
      .map((m) => m.name);
    btn.textContent = selectedMudurlukIds.size <= 2
      ? names.join(', ')
      : `${names.slice(0, 1).join(', ')} +${selectedMudurlukIds.size - 1} daha`;
  }

  function initMudurlukMultiselect(allMudurlukler) {
    const btn = el('cMudurlukBtn');
    const panel = el('cMudurlukPanel');
    const list = el('cMudurlukList');
    const search = el('cMudurlukSearch');

    list.innerHTML = allMudurlukler
      .map((m) => `
        <label class="ms-option" data-name="${escapeHtml(m.name.toLocaleLowerCase('tr-TR'))}">
          <input type="checkbox" value="${m.id}" />
          <span>${escapeHtml(m.name)}</span>
        </label>
      `)
      .join('');

    list.querySelectorAll('input[type="checkbox"]').forEach((cb) => {
      cb.addEventListener('change', () => {
        const id = Number(cb.value);
        if (cb.checked) selectedMudurlukIds.add(id);
        else selectedMudurlukIds.delete(id);
        updateMudurlukTrigger(allMudurlukler);
      });
    });

    btn.addEventListener('click', () => {
      panel.style.display = panel.style.display === 'none' ? 'flex' : 'none';
      if (panel.style.display === 'flex') search.focus();
    });

    search.addEventListener('input', () => {
      const q = search.value.trim().toLocaleLowerCase('tr-TR');
      list.querySelectorAll('.ms-option').forEach((opt) => {
        opt.classList.toggle('hidden', q && !opt.dataset.name.includes(q));
      });
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.ms-field')) panel.style.display = 'none';
    });
  }

  function resetMudurlukSelection() {
    selectedMudurlukIds.clear();
    el('cMudurlukList').querySelectorAll('input[type="checkbox"]').forEach((cb) => { cb.checked = false; });
    el('cMudurlukBtn').textContent = 'Seçiniz…';
    el('cMudurlukPanel').style.display = 'none';
  }

  async function handleAddCompany(e) {
    e.preventDefault();
    const msg = el('addCompanyMsg');
    const title = el('cTitle').value.trim();
    const taxNumber = el('cTaxNumber').value.trim();

    if (!title) {
      msg.textContent = 'Şirket unvanı zorunludur.';
      return;
    }

    if (extConnected && !manualMode) {
      const submitBtn = el('addCompanySubmit');
      submitBtn.disabled = true;
      msg.textContent = 'Tespit ediliyor…';
      try {
        const result = await detectAndAddViaExtension(title);
        if (result.found) {
          const registryNames = result.registries.map((r) => r.name).join(', ');
          msg.textContent = `"${result.company.title}" eklendi. Sicil müdürlüğü: ${registryNames}`;
          el('addCompanyForm').reset();
          resetMudurlukSelection();
          await Promise.all([loadStats(), loadCompanies()]);
        } else if (result.partialMatches && result.partialMatches.length > 0) {
          const suggestions = result.partialMatches
            .slice(0, 3)
            .map((m) => `"${m.foundTitles[0]}" (${m.name})`)
            .join(' | ');
          msg.textContent = `Tam eşleşme bulunamadı, yakın unvanlar: ${suggestions}. Unvanı kontrol edip tekrar deneyin.`;
        } else {
          msg.textContent = "TTSG'de bu unvanla kayıtlı bir ilan bulunamadı.";
        }
      } catch (err) {
        msg.textContent = `Hata: ${err.message}`;
      } finally {
        submitBtn.disabled = false;
      }
      return;
    }

    // Elle mod (veya eklenti bağlı değil): mevcut manuel akış, değişmedi.
    const sicilMudurlukleri = Array.from(selectedMudurlukIds);
    if (sicilMudurlukleri.length === 0) {
      msg.textContent = 'En az bir Sicil Müdürlüğü seçmelisiniz.';
      return;
    }

    msg.textContent = 'Ekleniyor…';
    try {
      const res = await fetch('/api/companies', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, sicilMudurlukleri, taxNumber: taxNumber || undefined }),
      });
      const json = await res.json();
      if (!res.ok) throw new Error(json.error || 'Eklenemedi');

      msg.textContent = `"${json.data.title}" eklendi.`;
      el('addCompanyForm').reset();
      resetMudurlukSelection();
      await Promise.all([loadStats(), loadCompanies()]);
    } catch (err) {
      msg.textContent = `Hata: ${err.message}`;
    }
  }

  async function loadCompanies() {
    const body = el('companyListBody');
    try {
      const res = await fetch('/api/companies');
      if (!res.ok) throw new Error('sirketler yuklenemedi');
      const json = await res.json();
      const companies = json.data || [];

      if (companies.length === 0) {
        body.innerHTML = '<tr class="state-row"><td colspan="4">Henüz takip edilen şirket yok.</td></tr>';
        return;
      }

      body.innerHTML = companies
        .map((c) => `
          <tr>
            <td><div class="company-title">${escapeHtml(c.title)}</div></td>
            <td>${escapeHtml((c.sicil_mudurlukleri || []).map((m) => m.name).join(', ') || '—')}</td>
            <td>${c.tax_number ? escapeHtml(c.tax_number) : '<span class="muted">—</span>'}</td>
            <td><button class="danger" data-id="${c.id}" data-title="${escapeHtml(c.title)}">Kaldır</button></td>
          </tr>
        `)
        .join('');

      body.querySelectorAll('button.danger').forEach((btn) => {
        btn.addEventListener('click', () => handleRemoveCompany(btn.dataset.id, btn.dataset.title));
      });
    } catch (err) {
      body.innerHTML = '<tr class="state-row"><td colspan="4">Şirketler yüklenirken bir hata oluştu.</td></tr>';
    }
  }

  async function handleRemoveCompany(id, title) {
    if (!confirm(`"${title}" takipten kaldırılsın mı? Bu şirkete ait tüm gelişme kayıtları da silinecek.`)) return;

    try {
      const res = await fetch(`/api/companies/${id}`, { method: 'DELETE' });
      const json = await res.json();
      if (!res.ok) throw new Error(json.error || 'Kaldırılamadı');

      await Promise.all([loadStats(), loadCompanies()]);
      offset = 0;
      await loadEvents();
    } catch (err) {
      alert(`Hata: ${err.message}`);
    }
  }

  async function loadStats() {
    try {
      const res = await fetch('/api/stats');
      if (!res.ok) throw new Error('stats yuklenemedi');
      const stats = await res.json();
      el('statCompanies').textContent = stats.totalCompanies;
      el('statEvents').textContent = stats.totalEvents;
      el('statWeek').textContent = stats.eventsThisWeek;
    } catch (err) {
      console.error(err);
    }
  }

  function buildQuery() {
    const params = new URLSearchParams();
    const sector = el('fSector').value;
    const eventType = el('fEventType').value;
    const company = el('fCompany').value.trim();
    const dateFrom = el('fDateFrom').value;
    const dateTo = el('fDateTo').value;

    if (sector) params.set('sector', sector);
    if (eventType) params.set('eventType', eventType);
    if (company) params.set('company', company);
    if (dateFrom) params.set('dateFrom', dateFrom);
    if (dateTo) params.set('dateTo', dateTo);
    params.set('limit', PAGE_SIZE);
    params.set('offset', offset);
    return params.toString();
  }

  function renderBadges(row) {
    const active = eventTypeMeta.filter((e) => row[e.key]);
    if (active.length === 0) return '<span class="muted">—</span>';

    return `<div class="event-badges">${active
      .map((e) => {
        const idx = eventTypeMeta.findIndex((x) => x.key === e.key);
        return `<span class="badge"><span class="dot" style="background:${slotColor(idx)}"></span>${escapeHtml(e.label)}</span>`;
      })
      .join('')}</div>`;
  }

  function renderRows(data) {
    if (!data || data.length === 0) {
      eventsBody.innerHTML = '<tr class="state-row"><td colspan="7">Filtreyle eşleşen gelişme bulunamadı.</td></tr>';
      return;
    }

    eventsBody.innerHTML = data
      .map((row, i) => {
        const company = row.companies || {};
        const rowId = `excerpt-${i}`;
        const excerpt = row.raw_text_excerpt
          ? `<button class="excerpt-toggle" data-target="${rowId}">Alıntıyı göster</button>`
          : '<span class="muted">—</span>';

        return `
          <tr>
            <td><div class="company-title">${escapeHtml(company.title || 'Bilinmiyor')}</div></td>
            <td><span class="sector-pill">${escapeHtml((company.sector || 'Diger').replace(/_/g, ' '))}</span></td>
            <td>${row.gazette_date ? escapeHtml(row.gazette_date) : '<span class="muted">—</span>'}</td>
            <td>${row.gazette_no ? escapeHtml(row.gazette_no) : '<span class="muted">—</span>'}</td>
            <td>${renderBadges(row)}</td>
            <td class="col-summary">${row.ai_summary ? escapeHtml(row.ai_summary) : '<span class="muted">—</span>'}</td>
            <td>
              <a class="pdf-link" href="${escapeHtml(row.pdf_url)}" target="_blank" rel="noopener noreferrer">PDF'i Aç</a><br/>
              ${excerpt}
            </td>
          </tr>
          <tr class="excerpt-row" id="${rowId}" style="display:none">
            <td colspan="7">${escapeHtml(row.raw_text_excerpt || '')}</td>
          </tr>
        `;
      })
      .join('');

    eventsBody.querySelectorAll('.excerpt-toggle').forEach((btn) => {
      btn.addEventListener('click', () => {
        const target = document.getElementById(btn.dataset.target);
        const isHidden = target.style.display === 'none';
        target.style.display = isHidden ? 'table-row' : 'none';
        btn.textContent = isHidden ? 'Alıntıyı gizle' : 'Alıntıyı göster';
      });
    });
  }

  async function loadEvents() {
    eventsBody.innerHTML = '<tr class="state-row"><td colspan="7">Yükleniyor…</td></tr>';
    try {
      const res = await fetch(`/api/events?${buildQuery()}`);
      if (!res.ok) throw new Error('events yuklenemedi');
      const json = await res.json();
      totalCount = json.count || 0;
      renderRows(json.data);

      const from = totalCount === 0 ? 0 : offset + 1;
      const to = Math.min(offset + PAGE_SIZE, totalCount);
      pageInfo.textContent = `${from}-${to} / ${totalCount} sonuç`;
      el('prevPage').disabled = offset === 0;
      el('nextPage').disabled = offset + PAGE_SIZE >= totalCount;
    } catch (err) {
      console.error(err);
      eventsBody.innerHTML = '<tr class="state-row"><td colspan="7">Veriler yüklenirken bir hata oluştu.</td></tr>';
      pageInfo.textContent = '—';
    }
  }

  el('addCompanyForm').addEventListener('submit', handleAddCompany);

  el('filterForm').addEventListener('submit', (e) => {
    e.preventDefault();
    offset = 0;
    loadEvents();
  });

  el('clearFilters').addEventListener('click', () => {
    el('filterForm').reset();
    offset = 0;
    loadEvents();
  });

  el('prevPage').addEventListener('click', () => {
    offset = Math.max(0, offset - PAGE_SIZE);
    loadEvents();
  });

  el('nextPage').addEventListener('click', () => {
    if (offset + PAGE_SIZE < totalCount) {
      offset += PAGE_SIZE;
      loadEvents();
    }
  });

  const themeToggle = el('themeToggle');
  themeToggle.addEventListener('click', () => {
    const root = document.documentElement;
    const current = root.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    localStorage.setItem('ttsg-theme', next);
  });
  const savedTheme = localStorage.getItem('ttsg-theme');
  if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);

  (async function init() {
    initExtensionBridge();
    await loadMeta();
    await Promise.all([loadStats(), loadEvents(), loadCompanies()]);
  })();
})();
</script>
</body>
</html>
